plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    implementation "net.fabricmc:fabric-language-kotlin:$rootProject.fabric_language_kotlin_version"

    // Fabric API. This is technically optional, but you probably want it anyway.
    implementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    implementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    // Cloth Config is provided by the player at runtime; it is required in fabric.mod.json.
    implementation "me.shedaniel.cloth:cloth-config-fabric:$rootProject.cloth_config_version"

    // Mod Menu is optional at runtime; it only exposes the config screen in its mod list.
    implementation "com.terraformersmc:modmenu:$rootProject.modmenu_version"

    common(project(path: ':common')) { transitive = false }
    shadowBundle(project(path: ':common', configuration: 'transformProductionFabric')) { transitive = false }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mod_id', rootProject.mod_id
    inputs.property 'fabric_language_kotlin_version', rootProject.fabric_language_kotlin_version

    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version,
                mod_id: inputs.properties.mod_id,
                fabric_language_kotlin_version: inputs.properties.fabric_language_kotlin_version
    }

    eachFile { file ->
        if (file.path.startsWith('assets/mod_id/')) {
            file.path = file.path.replaceFirst('assets/mod_id/', "assets/${rootProject.mod_id}/")
        }
    }
}

// Minecraft is not obfuscated on this version, so there is no remapJar task.
// The shaded jar is the mod jar that ships.
jar {
    archiveClassifier = 'dev'
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null
}

assemble.dependsOn shadowJar

configurations {
    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
}
