architectury {
    common rootProject.enabled_platforms.split(',')
}

def nativeProject = layout.projectDirectory.dir("src/native")
def nativeResources = layout.buildDirectory.dir("generated/native-resources")
def androidLibcConfig = layout.buildDirectory.file("generated/android-libc.txt")
def hostTag = System.getProperty("os.name").toLowerCase().contains("windows")
    ? "windows-x86_64"
    : (System.getProperty("os.name").toLowerCase().contains("mac") ? "darwin-x86_64" : "linux-x86_64")
def findAndroidNdk = {
    def candidates = []
    ["ANDROID_NDK_HOME", "ANDROID_NDK_ROOT"].each { name ->
        def value = System.getenv(name)
        if (value) {
            candidates << new File(value)
        }
    }
    def sdk = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
    if (sdk) {
        def ndkRoot = new File(sdk, "ndk")
        def dirs = ndkRoot.isDirectory() ? ndkRoot.listFiles() : null
        if (dirs != null) {
            candidates.addAll(dirs.findAll { it.isDirectory() }.sort { it.name }.reverse())
        }
    }
    candidates.find { it.isDirectory() }
}
def androidNdk = findAndroidNdk()
def androidApi = 26
def modId = rootProject.mod_id
def nativeLibrary = "${modId}_grep"
def nativeTargets = [
    [zig: "x86_64-windows-gnu", dir: "windows-x86_64", subdir: "bin", file: "${nativeLibrary}.dll"],
    [zig: "aarch64-windows-gnu", dir: "windows-aarch64", subdir: "bin", file: "${nativeLibrary}.dll"],
    [zig: "x86_64-linux-gnu", dir: "linux-x86_64", subdir: "lib", file: "lib${nativeLibrary}.so"],
    [zig: "aarch64-linux-gnu", dir: "linux-aarch64", subdir: "lib", file: "lib${nativeLibrary}.so"],
    [zig: "aarch64-linux-android", dir: "android-aarch64", subdir: "lib", file: "lib${nativeLibrary}.so", android: true],
    [zig: "x86_64-macos", dir: "macos-x86_64", subdir: "lib", file: "lib${nativeLibrary}.dylib"],
    [zig: "aarch64-macos", dir: "macos-aarch64", subdir: "lib", file: "lib${nativeLibrary}.dylib"],
]

tasks.register("buildNativeGrep") {
    group = "build"
    description = "Builds the optional comb grep libraries for Windows, Linux, macOS, and Android arm64."

    inputs.files(fileTree(nativeProject) {
        include "build.zig", "build.zig.zon", "src/**"
    })
    inputs.property("targets", nativeTargets.toString())
    inputs.property("androidNdk", androidNdk?.absolutePath ?: "")
    inputs.property("androidApi", androidApi)
    outputs.dir(nativeResources)

    doLast {
        delete(nativeResources.get().asFile)
        try {
            def probe = new ProcessBuilder("zig", "version")
                .directory(nativeProject.asFile)
                .redirectErrorStream(true)
                .start()
            if (probe.waitFor() != 0) {
                logger.warn("Skipping native grep: zig is not available.")
                return
            }
        } catch (Exception error) {
            logger.warn("Skipping native grep: ${error.message}")
            return
        }

        nativeTargets.each { target ->
            def prefix = nativeProject.dir("zig-out/${target.zig}").asFile
            def command = ["zig", "build", "-Drelease", "-Dtarget=${target.zig}", "-Dlibrary-name=${nativeLibrary}"]
            if (target.android) {
                if (androidNdk == null) {
                    logger.warn("Skipping Android native grep: Android NDK is not installed.")
                    return
                }
                def sysroot = new File(androidNdk, "toolchains/llvm/prebuilt/${hostTag}/sysroot")
                def apiDir = new File(sysroot, "usr/lib/aarch64-linux-android/${androidApi}")
                if (!apiDir.isDirectory()) {
                    logger.warn("Skipping Android native grep: NDK sysroot not found at ${sysroot}.")
                    return
                }
                def libcConfig = androidLibcConfig.get().asFile
                libcConfig.parentFile.mkdirs()
                libcConfig.text = """include_dir=${sysroot}/usr/include
sys_include_dir=${sysroot}/usr/include/aarch64-linux-android
cc_dir=${apiDir}
crt_dir=${apiDir}
msvc_lib_dir=
kernel32_lib_dir=
darwin_sdk_dir=
"""
                command.addAll(["--libc", libcConfig.absolutePath, "--sysroot", sysroot.absolutePath])
            }
            command.addAll(["--prefix", prefix.absolutePath])
            def process = new ProcessBuilder(command.collect { it.toString() })
                .directory(nativeProject.asFile)
                .inheritIO()
                .start()
            if (process.waitFor() != 0) {
                throw new GradleException("Native grep build failed for ${target.zig}.")
            }
            def source = new File(prefix, "${target.subdir}/${target.file}")
            if (!source.isFile()) {
                throw new GradleException("Native grep output missing for ${target.zig}: ${source}")
            }
            def destination = nativeResources.get().dir("assets/mod_id/native/${target.dir}").asFile
            destination.mkdirs()
            copy {
                from source
                into destination
            }
        }
    }
}

sourceSets.main.resources.srcDir(nativeResources)
processResources {
    inputs.property 'mod_id', rootProject.mod_id
    rename('mixins.json', "${rootProject.mod_id}.mixins.json")

    eachFile { file ->
        if (file.path.startsWith('assets/mod_id/')) {
            file.path = file.path.replaceFirst('assets/mod_id/', "assets/${rootProject.mod_id}/")
        }
    }

    filesMatching('assets/**/lang/*.json') {
        expand mod_id: inputs.properties.mod_id
    }
}
processResources.dependsOn(tasks.named("buildNativeGrep"))

tasks.named("sourcesJar") {
    dependsOn(tasks.named("buildNativeGrep"))
    exclude 'assets/**/native/**'
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    implementation "dev.architectury:architectury:$rootProject.architectury_api_version"

    // Cloth Config common API; the platform modules provide the runtime implementation.
    compileOnly "me.shedaniel.cloth:cloth-config:$rootProject.cloth_config_version"
}
