modLoader = "kotlinforforge"
loaderVersion = "[6.5.0,)"
issueTrackerURL = "https://github.com/NTS-Official/InGame-ConsoleAndLogging/issues"
license = "GPL-3.0-only"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "In-Game Console & Logging"
authors = "NoTuring_Steve"
description = '''
An in-game logging viewer and command console with a adjustable overlay.
'''
logoFile = "assets/${mod_id}/icon_large.png" # Deprecated when using newer version of neoforge
# Replacement for newer version of neoforge.
# iconFile = "assets/${mod_id}/icon.png"
# bannerFile = "assets/${mod_id}/icon_large.png"

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "[26.1.2,)"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "[26.1.2,)"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "architectury"
type = "required"
versionRange = "[20.1.16,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "cloth_config"
type = "required"
versionRange = "[26.1.154,)"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "${mod_id}.mixins.json"
